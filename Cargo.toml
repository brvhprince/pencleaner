[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
libc = "0.2"
parking_lot = "0.12"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Optimized but quick to rebuild: for examples and dry runs (`--profile scan`).
[profile.scan]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
