[package]
name = "pencleaner-core"
description = "Scanning and cleanup engine for PenCleaner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
rayon.workspace = true
libc.workspace = true
parking_lot.workspace = true
trash.workspace = true
serde_json.workspace = true
plist = "1"
blake3 = "1"
base64 = "0.23"
quick-xml = "0.42"
ed25519-dalek = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
foreign-types = "0.5"
core-foundation-sys = "0.8"
# Apple's XProtect rules only `import "hash"`; skip the other modules.
yara-x = { version = "1", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "hash-module", "generate-proto-code"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
